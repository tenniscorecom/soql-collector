# Ruff（リント・フォーマット）の設定。comken 本体と揃える。
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # E=style, F=pyflakes, W=warning, I=import order
ignore = []

[tool.ruff.lint.per-file-ignores]
# テストのフィクスチャは日本語の見出しや URL を含むので、行が 100 字を超える。改行すると
# データ構造が壊れて読みづらくなるため、テストに限り E501 を許容する
"tests/**/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src", "F:/dev"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soql-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
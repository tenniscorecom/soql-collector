# Ruff（リント・フォーマット）の設定。comken 本体と揃える。
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "LOG", "G", "DTZ", "RUF", "TID", "C90"]
ignore = [
    # 日本語のコード・コメント・docstring を「紛らわしい文字」として大量に誤検知するため
    "RUF001", "RUF002", "RUF003",
    # __all__ は意味のまとまり順に並べているため、アルファベット順の強制は受け入れない
    "RUF022",
]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import は禁止。ドットを数える作業を残さないため。
# 必ず `from src.X import Y` のようにパッケージルートから書く（CONVENTIONS.md 参照）
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# 分岐の絡み合いの上限。
# 関数を分割するたびに下げる（目標 10）。
# 2026-10-16 時点の実測最大は mapping.build_relation_chains の 14。
# 依頼で指定された対象関数 ( soql_builder の _build_where_clause / _build_filter_condition
# / build_soql / _format_value_for_field, fetch の _fetch_one / _collect_related_objects,
# column_fix_xlsx の _walk_soql_path, 余裕分の xlsx_style._is_wide / similar._group_pairs )
# は全て ≤ 12 に分割済み。
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# テストのフィクスチャは日本語の見出しや URL を含むので、行が 100 字を超える。改行すると
# データ構造が壊れて読みづらくなるため、テストに限り E501 を許容する
# C90 (mccabe) は ``_make_record`` のようなテストヘルパが大量のパラメータを持つため、
# 本体コードと同じ複雑度上限を掛けると過剰になる。テストの挙動には影響しないので許容する
"tests/**/*.py" = ["E501", "C901"]

[tool.pytest.ini_options]
# `src` パッケージは `python -m pytest` をルートで実行すれば自動的に sys.path に入る。
# comken （ 共有ライブラリ。 その中に `comken/` パッケージがある ） の置き場所は
# 環境変数 `PYTHON_LIBRARY` か、 隣接する `../comken` フォルダから自動で拾う。
# 詳細は `tests/conftest.py` を参照。
# 直書きの `pythonpath` は使わない （ 共有リポジトリ側の場所を持ち込まないため ）。

[tool.pyright]
# 開発時は隣接する comken リポジトリを直接参照する。実行環境では
# 環境変数 ``PYTHON_LIBRARY`` の値を ``PYTHONPATH`` に足して使う。
extraPaths = [".", "../comken"]
